apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-django-api
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-django-api
  template:
    metadata:
      labels:
        app: robot-django-api
    spec:
      containers:
      - name: django
        image: docker.io/library/robot-django-api:latest   # <-- Use the full name
        imagePullPolicy: Never                             # <-- Tell K8s never to pull
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: robot-django-api-service
  namespace: staging
spec:
  selector:
    app: robot-django-api
  ports:
  - port: 8000
    targetPort: 8000