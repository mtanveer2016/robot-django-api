apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-django-api
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-django-api
  template:
    metadata:
      labels:
        app: robot-django-api
    spec:
      containers:
      - name: django
        image: robot-django-api:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        volumeMounts:                 # <-- Add this block
        - name: db-storage
          mountPath: /app/db.sqlite3  # <-- Save the DB file here
      volumes:                        # <-- Add this block
      - name: db-storage
        hostPath:
          path: /home/aiml/robot-django-db/db.sqlite3
          type: FileOrCreate
